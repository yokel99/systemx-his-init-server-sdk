server {
    listen 80;
    server_name his-api.systemx-th.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name his-api.systemx-th.com;

    # SSL Certificate (ใช้ certbot หรือใส่ path ของ cert ที่มีอยู่)
    ssl_certificate     /etc/letsencrypt/live/his-api.systemx-th.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/his-api.systemx-th.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload size (ต้องตรง APP_MAXSIZE ใน .env)
    client_max_body_size 10M;

    # Proxy to app container
    location / {
        proxy_pass         http://127.0.0.1:9991;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300;
        proxy_send_timeout  300;
        proxy_connect_timeout 60;
    }
}
