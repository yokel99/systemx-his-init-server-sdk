name: SystemX-HIS

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: systemx-his-bkkcs-api-server
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3005"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - mongo_mongo_net
      - systemx_his_bkkcs

networks:
  mongo_mongo_net:
    external: true
  systemx_his_bkkcs:
    external: true
